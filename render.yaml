# Render Infrastructure-as-Code Blueprint for upwork-bid-agent-n8n
services:
  - type: web
    name: upwork-bid-agent-n8n
    runtime: docker
    dockerfilePath: n8n/Dockerfile
    dockerContext: n8n
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: EXECUTIONS_PROCESS
        value: "main"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_PAYLOAD_SIZE_MAX
        value: "16"
      - key: N8N_DISABLE_PRODUCTION_MAIN_PROCESS_WARNING
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
